<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Animated Boy Customizer</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <style>
    body {
      background-color: #e3f2fd;
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 20px;
    }

    h1 {
      color: #0d47a1;
    }

    .boy {
      position: relative;
      width: 120px;
      height: 260px;
      margin: 20px auto;
    }

    /* Head */
    .head {
      width: 100px;
      height: 100px;
      background-color: #ffcc80;
      border-radius: 50%;
      position: absolute;
      top: 0;
      left: 10px;
      z-index: 2;
    }

    /* Eyes */
    .eye {
      width: 10px;
      height: 10px;
      background-color: black;
      border-radius: 50%;
      position: absolute;
      top: 35px;
      animation: blink 3s infinite;
    }

    .eye.left { left: 25px; }
    .eye.right { right: 25px; }

    @keyframes blink {
      0%, 90%, 100% { height: 10px; }
      95% { height: 2px; }
    }

    /* Hair */
    .hair {
      width: 100px;
      height: 50px;
      background-color: brown;
      border-radius: 50% 50% 0 0;
      position: absolute;
      top: 0;
      left: 10px;
      z-index: 3;
      animation: wave 4s infinite ease-in-out;
    }

    @keyframes wave {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(1.5deg); }
    }

    /* Body / Shirt */
    .body {
      width: 60px;
      height: 90px;
      background-color: lightblue;
      position: absolute;
      top: 100px;
      left: 30px;
      border-radius: 10px;
      animation: float 3s ease-in-out infinite;
      z-index: 1;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-4px); }
    }

    /* Arms */
    .arm {
      width: 10px;
      height: 70px;
      background-color: #ffcc80;
      position: absolute;
      top: 110px;
      transform-origin: top center;
      animation: swing 3s ease-in-out infinite;
      z-index: 0;
    }

    .arm.left { left: 15px; transform: rotate(10deg); }
    .arm.right { right: 15px; transform: rotate(-10deg); }

    @keyframes swing {
      0%, 100% { transform: rotate(10deg); }
      50% { transform: rotate(0deg); }
    }

    /* Hands */
    .hand {
      width: 12px;
      height: 12px;
      background-color: #ffcc80;
      border-radius: 50%;
      position: absolute;
      top: 175px;
    }

    .hand.left { left: 10px; }
    .hand.right { right: 10px; }

    /* Legs */
    .leg {
      width: 10px;
      height: 50px;
      background-color: #ffcc80;
      position: absolute;
      top: 190px;
    }

    .leg.left { left: 35px; }
    .leg.right { right: 35px; }
