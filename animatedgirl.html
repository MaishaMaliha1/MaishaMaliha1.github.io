<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Animated Girl Customizer</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <style>
    body {
      background-color: #e0f7fa;
      font-family: Arial, sans-serif;
      padding: 20px;
      text-align: center;
    }

    h1 {
      color: #00796b;
    }

    .girl {
      position: relative;
      width: 120px;
      height: 260px;
      margin: 20px auto;
    }

    /* Head */
    .head {
      width: 100px;
      height: 100px;
      background-color: #ffeb3b;
      border-radius: 50%;
      position: absolute;
      top: 0;
      left: 10px;
      z-index: 2;
    }

    /* Eyes */
    .eye {
      width: 10px;
      height: 10px;
      background-color: black;
      border-radius: 50%;
      position: absolute;
      top: 35px;
      animation: blink 3s infinite;
    }

    .eye.left { left: 30px; }
    .eye.right { right: 30px; }

    @keyframes blink {
      0%, 90%, 100% { height: 10px; }
      95% { height: 2px; }
    }

    /* Hair */
    .hair {
      width: 120px;
      height: 100px;
      background-color: brown;
      border-radius: 50% 50% 40% 40%;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
      animation: wave 5s infinite ease-in-out;
    }

    @keyframes wave {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(2deg); }
    }

    /* Body / Dress */
    .body {
      width: 60px;
      height: 100px;
      background-color: pink;
      position: absolute;
      top: 100px;
      left: 30px;
      border-radius: 0 0 40px 40px;
      animation: float 4s ease-in-out infinite;
      z-index: 1;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-5px); }
    }

    /* Arms */
    .arm {
      width: 10px;
      height: 70px;
      background-color: #ffeb3b;
      position: absolute;
      top: 110px;
      transform-origin: top center;
      animation: swing 3s ease-in-out infinite;
      z-index: 0;
    }

    .arm.left { left: 15px; transform: rotate(10deg); }
    .arm.right { right: 15px; transform: rotate(-10deg); }

    @keyframes swing {
      0%, 100% { transform: rotate(10deg); }
      50% { transform: rotate(0deg); }
    }

    /* Hands */
    .hand {
      width: 12px;
      height: 12px;
      background-color: #ffeb3b;
      border-radius: 50%;
      position: absolute;
      top: 175px;
    }

    .hand.left { left: 10px; }
    .hand.right { right: 10px; }

    /* Legs */
    .leg {
      width: 10px;
      height: 50px;
      background-color: #ffeb3b;
      position: absolute;
      top: 200px;
    }

    .leg.left { left: 35px; }
    .leg.right { right: 35px; }

    /* Feet (Shoes) */
    .foot {
      width: 20px;
      height: 10px;
      background-color: black;
      position: absolute;
      top: 250px;
    }

    .foot.left { left: 30px; }
    .foot.right { right: 30px; }

    #controls {
      margin-top: 20px;
    }

    input[type="color"] {
      padding: 4px;
      margin: 0 10px;
    }

    #preview-img {
      margin-top: 10px;
      border: 2px dashed #0097a7;
      max-width: 200px;
    }

    #generated-link {
      margin-top: 5px;
      display: block;
      font-size: 14px;
      color: #00796b;
      word-break: break-all;
    }
  </style>
</head>
<body>

  <h1>Animated Girl</h1>
  <div class="girl" id="girl">
    <div class="hair" id="hair"></div>
    <div class="head">
      <div class="eye left"></div>
      <div class="eye right"></div>
    </div>
    <div class="body" id="dress"></div>
    <div class="arm left"></div>
    <div class="arm right"></div>
    <div class="hand left"></div>
    <div class="hand right"></div>
    <div class="leg left"></div>
    <div class="leg right"></div>
    <div class="foot left" id="footLeft"></div>
    <div class="foot right" id="footRight"></div>
  </div>

  <div id="controls">
    <label>Hair Color: <input type="color" id="hairColor" value="#A52A2A"></label>
    <label>Dress Color: <input type="color" id="dressColor" value="#FFC0CB"></label>
    <label>Shoe Color: <input type="color" id="shoeColor" value="#000000"></label>
    <button onclick="generateImage()">Generate Image</button>
    <br><br>
    <img id="preview-img" />
    <a id="generated-link" target="_blank"></a>
  </div>

  <script>
    const hair = document.getElementById('hair');
    const dress = document.getElementById('dress');
    const footLeft = document.getElementById('footLeft');
    const footRight = document.getElementById('footRight');

    document.getElementById('hairColor').addEventListener('input', function() {
      hair.style.backgroundColor = this.value;
    });

    document.getElementById('dressColor').addEventListener('input', function() {
      dress.style.backgroundColor = this.value;
    });

    document.getElementById('shoeColor').addEventListener('input', function() {
      footLeft.style.backgroundColor = this.value;
      footRight.style.backgroundColor = this.value;
    });

    function generateImage() {
      const girl = document.getElementById('girl');
      html2canvas(girl).then(canvas => {
        const img = document.getElementById('preview-img');
        img.src = canvas.toDataURL('image/png');
        const link = document.getElementById('generated-link');
        link.href = img.src;
        link.textContent = "Copy this image link";
      });
    }
  </script>
<footer>
    Developed by Maisha Maliha
    <img src="citations.jpeg" alt="Maisha's photo">
  </footer>
</body>
</html>
