<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Collection</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding: 20px;
        }

        h1 {
            font-size: 30px;
        }

        #tic-tac-toe, #ping-pong, #snake {
            margin-top: 30px;
        }

        /* Tic-Tac-Toe Styles */
        #game-board {
            display: inline-block;
            margin-top: 20px;
        }

        .row {
            display: flex;
        }

        .cell {
            width: 100px;
            height: 100px;
            border: 1px solid #000;
            display: inline-block;
            text-align: center;
            line-height: 100px;
            font-size: 2em;
            cursor: pointer;
        }

        button {
            margin-top: 20px;
            padding: 10px;
            font-size: 1em;
        }

        /* Ping Pong Styles */
        #pong-game {
            display: flex;
            justify-content: center;
            margin-top: 50px;
            border: 2px solid black;
            position: relative;
            height: 400px;
            width: 600px;
        }

        #pong-canvas {
            background-color: #000;
            display: block;
        }

        /* Snake Styles */
        #snake-game {
            display: flex;
            justify-content: center;
            margin-top: 50px;
            border: 2px solid black;
            position: relative;
            height: 400px;
            width: 600px;
        }

        #snake-canvas {
            background-color: #000;
            display: block;
        }

    </style>
</head>
<body>
    <h1>Game Collection</h1>

    <!-- Tic-Tac-Toe Game -->
    <div id="tic-tac-toe">
        <h2>Tic-Tac-Toe</h2>
        <div id="game-board">
            <div class="row">
                <div class="cell" onclick="makeMove(0,0)"></div>
                <div class="cell" onclick="makeMove(0,1)"></div>
                <div class="cell" onclick="makeMove(0,2)"></div>
            </div>
            <div class="row">
                <div class="cell" onclick="makeMove(1,0)"></div>
                <div class="cell" onclick="makeMove(1,1)"></div>
                <div class="cell" onclick="makeMove(1,2)"></div>
            </div>
            <div class="row">
                <div class="cell" onclick="makeMove(2,0)"></div>
                <div class="cell" onclick="makeMove(2,1)"></div>
                <div class="cell" onclick="makeMove(2,2)"></div>
            </div>
        </div>
        <button onclick="resetGame()">Restart Game</button>
    </div>

    <!-- Ping Pong Game -->
    <div id="ping-pong">
        <h2>Ping Pong Game</h2>
        <div id="pong-game">
            <canvas id="pong-canvas" width="600" height="400"></canvas>
        </div>
        <p>Player 1: <span id="score1">0</span> - Player 2: <span id="score2">0</span></p>
    </div>

    <!-- Snake Game -->
    <div id="snake">
        <h2>Snake Game</h2>
        <div id="snake-game">
            <canvas id="snake-canvas" width="600" height="400"></canvas>
        </div>
    </div>

    <script>
        // ===============================
        // Tic-Tac-Toe JavaScript
        // ===============================

        let board = [
            ['', '', ''],
            ['', '', ''],
            ['', '', '']
        ];
        let currentPlayer = 'X';

        function makeMove(row, col) {
            if (board[row][col] === '') {
                board[row][col] = currentPlayer;
                document.getElementsByClassName('row')[row].children[col].innerText = currentPlayer;
                if (checkWinner()) {
                    alert(currentPlayer + ' wins!');
                    setTimeout(resetGame, 1000);
                } else {
                    currentPlayer = currentPlayer === 'X' ? 'O' : 'X';
                }
            }
        }

        function checkWinner() {
            for (let i = 0; i < 3; i++) {
                if (board[i][0] === board[i][1] && board[i][1] === board[i][2] && board[i][0] !== '') {
                    return true;
                }
                if (board[0][i] === board[1][i] && board[1][i] === board[2][i] && board[0][i] !== '') {
                    return true;
                }
            }
            if (board[0][0] === board[1][1] && board[1][1] === board[2][2] && board[0][0] !== '') {
                return true;
            }
            if (board[0][2] === board[1][1] && board[1][1] === board[2][0] && board[0][2] !== '') {
                return true;
            }
            return false;
        }

        function resetGame() {
            board = [
                ['', '', ''],
                ['', '', ''],
                ['', '', '']
            ];
            let cells = document.getElementsByClassName('cell');
            for (let cell of cells) {
                cell.innerText = '';
            }
            currentPlayer = 'X';
        }

        // ===============================
        // Ping Pong JavaScript
        // ===============================
        
        const pongCanvas = document.getElementById('pong-canvas');
        const pongCtx = pongCanvas.getContext('2d');

        let paddleWidth = 10, paddleHeight = 100, ballSize = 10;
        let paddle1Y = (pongCanvas.height - paddleHeight) / 2, paddle2Y = (pongCanvas.height - paddleHeight) / 2;
        let ballX = pongCanvas.width / 2, ballY = pongCanvas.height / 2, ballSpeedX = 4, ballSpeedY = 4;
        let paddle1Speed = 0, paddle2Speed = 0;
        let score1 = 0, score2 = 0;

        function drawPaddles() {
            pongCtx.fillStyle = "#FFF";
            pongCtx.fillRect(0, paddle1Y, paddleWidth, paddleHeight);
            pongCtx.fillRect(pongCanvas.width - paddleWidth, paddle2Y, paddleWidth, paddleHeight);
        }

        function drawBall() {
            pongCtx.fillStyle = "#FFF";
            pongCtx.fillRect(ballX, ballY, ballSize, ballSize);
        }

        function moveBall() {
            ballX += ballSpeedX;
            ballY += ballSpeedY;

            if (ballY <= 0 || ballY + ballSize >= pongCanvas.height) {
                ballSpeedY = -ballSpeedY;
            }

            if (ballX <= paddleWidth && ballY >= paddle1Y && ballY <= paddle1Y + paddleHeight || 
                ballX + ballSize >= pongCanvas.width - paddleWidth && ballY >= paddle2Y && ballY <= paddle2Y + paddleHeight) {
                ballSpeedX = -ballSpeedX;
            }

            if (ballX < 0) {
                score2++;
                document.getElementById('score2').textContent = score2;
                resetBall();
            }

            if (ballX > pongCanvas.width) {
                score1++;
                document.getElementById('score1').textContent = score1;
                resetBall();
            }
        }

        function resetBall() {
            ballX = pongCanvas.width / 2;
            ballY = pongCanvas.height / 2;
            ballSpeedX = -ballSpeedX;
        }

        function movePaddles() {
            paddle1Y += paddle1Speed;
            paddle2Y += paddle2Speed;

            if (paddle1Y < 0) paddle1Y = 0;
            if (paddle1Y + paddleHeight > pongCanvas.height) paddle1Y = pongCanvas.height - paddleHeight;

            if (paddle2Y < 0) paddle2Y = 0;
            if (paddle2Y + paddleHeight > pongCanvas.height) paddle2Y = pongCanvas.height - paddleHeight;
        }

        function gameLoop() {
            pongCtx.clearRect(0, 0, pongCanvas.width, pongCanvas.height);
            drawPaddles();
            drawBall();
            moveBall();
            movePaddles();
            requestAnimationFrame(gameLoop);
        }

        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowUp') paddle2Speed = -6;
            if (e.key === 'ArrowDown') paddle2Speed = 6;
            if (e.key === 'w') paddle1Speed = -6;
            if (e.key === 's') paddle1Speed = 6;
        });

        document.addEventListener('keyup', (e) => {
            if (e.key === 'ArrowUp' || e.key === 'ArrowDown') paddle2Speed = 0;
            if (e.key === 'w' || e.key === 's') paddle1Speed = 0;
        });

        gameLoop();

        // ===============================
        // Snake Game JavaScript
        // ===============================

        const snakeCanvas = document.getElementById('snake-canvas');
        const snakeCtx = snakeCanvas.getContext('2d');

        const snakeSize = 20;
        let snake = [{ x: 100, y: 100 }];
        let direction = 'RIGHT';
        let food = generateFood();
        let score = 0;

        function drawSnake() {
            snakeCtx.fillStyle = "#FFF";
            for (let i = 0; i < snake.length; i++) {
                snakeCtx.fillRect(snake[i].x, snake[i].y, snakeSize, snakeSize);
            }
        }

        function generateFood() {
            let foodX = Math.floor(Math.random() * (snakeCanvas.width / snakeSize)) * snakeSize;
            let foodY = Math.floor(Math.random() * (snakeCanvas.height / snakeSize)) * snakeSize;
            return { x: foodX, y: foodY };
        }

        function drawFood() {
            snakeCtx.fillStyle = "red";
            snakeCtx.fillRect(food.x, food.y, snakeSize, snakeSize);
        }

        function moveSnake() {
            let head = { ...snake[0] };

            if (direction === 'UP') head.y -= snakeSize;
            if (direction === 'DOWN') head.y += snakeSize;
            if (direction === 'LEFT') head.x -= snakeSize;
            if (direction === 'RIGHT') head.x += snakeSize;

            snake.unshift(head);

            if (head.x === food.x && head.y === food.y) {
                score++;
                food = generateFood();
            } else {
                snake.pop();
            }

            if (head.x < 0 || head.x >= snakeCanvas.width || head.y < 0 || head.y >= snakeCanvas.height || isCollidingWithSnake(head)) {
                resetSnake();
            }
        }

        function isCollidingWithSnake(head) {
            for (let i = 1; i < snake.length; i++) {
                if (head.x === snake[i].x && head.y === snake[i].y) {
                    return true;
                }
            }
            return false;
        }

        function resetSnake() {
            snake = [{ x: 100, y: 100 }];
            direction = 'RIGHT';
            score = 0;
        }

        function gameLoopSnake() {
            snakeCtx.clearRect(0, 0, snakeCanvas.width, snakeCanvas.height);
            drawSnake();
            drawFood();
            moveSnake();
            setTimeout(gameLoopSnake, 100);
        }

        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowUp' && direction !== 'DOWN') direction = 'UP';
            if (e.key === 'ArrowDown' && direction !== 'UP') direction = 'DOWN';
            if (e.key === 'ArrowLeft' && direction !== 'RIGHT') direction = 'LEFT';
            if (e.key === 'ArrowRight' && direction !== 'LEFT') direction = 'RIGHT';
        });

        gameLoopSnake();
    </script>
</body>
</html>
